x-marlin-env: &marlin-env
  TZ: ${TZ:-Asia/Shanghai}
  NODE_ENV: production
  PORT: "2333"
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-localhost:*,127.0.0.1:*}
  PG_HOST: marlin-postgres
  PG_PORT: "5432"
  PG_USER: ${PG_USER:-mx}
  PG_PASSWORD: ${PG_PASSWORD:-mx}
  PG_DATABASE: ${PG_DATABASE:-mx_core}
  SNOWFLAKE_WORKER_ID: ${SNOWFLAKE_WORKER_ID:-2}
  REDIS_HOST: marlin-redis
  REDIS_PORT: "6379"
  ENCRYPT_ENABLE: ${ENCRYPT_ENABLE:-false}
  ENCRYPT_KEY: ${ENCRYPT_KEY:-}
  JWT_SECRET: ${JWT_SECRET:-marlin-local-change-before-production}
  DISABLE_CACHE: ${DISABLE_CACHE:-false}
  MX_DISABLE_TELEMETRY: ${MX_DISABLE_TELEMETRY:-true}
  MARLIN_REVIEW_PASSCODE: ${MARLIN_REVIEW_PASSCODE:-}
  MARLIN_OPENLIST_URL: ${MARLIN_OPENLIST_URL:-}
  MARLIN_OPENLIST_TOKEN: ${MARLIN_OPENLIST_TOKEN:-}
  MARLIN_OPENLIST_DIRECTORY: ${MARLIN_OPENLIST_DIRECTORY:-marlin/assets}
  MARLIN_OPENLIST_PUBLIC_URL: ${MARLIN_OPENLIST_PUBLIC_URL:-}

services:
  marlin-core:
    image: ${MX_CORE_IMAGE:-marlin-core:13.18.0}
    build:
      context: .
      dockerfile: dockerfile
    container_name: marlin-core-v3
    restart: unless-stopped
    ports:
      - "${MX_PORT:-2334}:2333"
    environment: *marlin-env
    volumes:
      - ./data-marlin/mx-space:/root/.mx-space
    depends_on:
      marlin-migrate:
        condition: service_completed_successfully
      marlin-redis:
        condition: service_started
    healthcheck:
      test: [CMD, curl, -f, "http://127.0.0.1:2333/api/v3/ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  marlin-migrate:
    image: ${MX_CORE_IMAGE:-marlin-core:13.18.0}
    build:
      context: .
      dockerfile: dockerfile
    container_name: marlin-core-migrate
    command: ["node", "migrate.mjs"]
    restart: "no"
    environment: *marlin-env
    depends_on:
      marlin-postgres:
        condition: service_healthy
      marlin-redis:
        condition: service_started

  marlin-postgres:
    image: postgres:16-alpine
    container_name: marlin-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER:-mx}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-mx}
      POSTGRES_DB: ${PG_DATABASE:-mx_core}
    ports:
      - "127.0.0.1:${PG_PORT_FORWARD:-5434}:5432"
    volumes:
      - ./data-marlin/postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${PG_USER:-mx} -d ${PG_DATABASE:-mx_core}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  marlin-redis:
    image: redis:8-alpine
    container_name: marlin-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./data-marlin/redis:/data
    healthcheck:
      test: [CMD-SHELL, "redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
